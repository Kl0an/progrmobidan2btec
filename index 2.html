<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Programação mobile</title>
    <style>
        body {
            font: 12pt Arial;
        }

        button {
            font-size: 12pt;
            padding: 30px;
            background-image: url("https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQbTK1NK10xbYAc_y3cRk5FgeXeE7sX7QDccw&s");
            background-position: right;
            color: #fff;
            text-decoration: underline;
            
        }
    </style>
</head>
<body>
    <h1>OLÁ?</h1>
    <h1 id="emoji-indicar">👇</h1>
    <button onclick="clicou()">Nome</button>
    <script>
        function clicou() {
            let nome = window.prompt('Qual é o seu nome?')
            window.alert('Olá '+nome+', é um prazer te conhecer !')
        }
    </script>
</body>
</html>
